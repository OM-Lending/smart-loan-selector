name: Retry admin email notifications

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-email-notifications
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
      EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME || 'OpenLending' }}
      ADMIN_NOTIFICATION_EMAILS: ${{ secrets.ADMIN_NOTIFICATION_EMAILS }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      EMAIL_NOTIFICATIONS_ENABLED: 'true'
      NOTIFICATION_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check notification configuration
        run: |
          for name in DATABASE_URL BREVO_API_KEY EMAIL_FROM_ADDRESS ADMIN_NOTIFICATION_EMAILS APP_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "Missing required configuration: $name"
              exit 1
            fi
          done
      - name: Install pnpm
        run: npm install --global pnpm@10.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - name: Send queued notifications
        run: pnpm notifications:send
